name: ai-at-framework

x-gpu: &gpu
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]

services:
  decision:
    <<: *gpu
    build: services/decision
    volumes:
      - hf-cache:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8791/')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10m  # the first start downloads the ~0.7 GB checkpoint

  ollama:
    <<: *gpu
    image: ollama/ollama:0.35.0
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 3

  ollama-init:
    image: ollama/ollama:0.35.0
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull", "gemma4:e4b"]  # no-op once the model is in the volume

  tests:
    build: .
    depends_on:
      decision:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
    environment:
      LAYA_URL: http://decision:8791
      TEXT_MODEL_BASE_URL: http://ollama:11434/v1
      TEXT_MODEL: gemma4:e4b
      TEXT_MODEL_API_KEY: ollama
      TEXT_MODEL_REASONING: none
    shm_size: 2gb  # Chromium crashes on Docker's default 64 MB /dev/shm
    ports:
      - "127.0.0.1:7900:7900"  # noVNC, reachable from this machine only
    volumes:
      - ./reports:/app/reports

volumes:
  hf-cache:
  ollama-models:
