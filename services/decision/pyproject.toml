[project]
name = "decision-service"
version = "0.1.0"
description = "Local TypeSafe-compatible /v1/systemone endpoint backed by the fine-tuned cklxx/laya-browser model."
requires-python = ">=3.12"
dependencies = [
    "laya==0.3.23",
    "torch==2.14.1",
    "huggingface_hub>=0.20",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
