# The whole suite on a CPU-only GitHub runner: laya-browser on CPU torch, Faker instead of the text model.
name: UI tests (CPU)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A newer PR push supersedes the running one; on main a cancel could interrupt the Pages deploy.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ui-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TEXT_SOURCE: faker
      LAYA_URL: http://127.0.0.1:8791
      RUN_MODE: ci
      # The image's /usr/bin/chromium aborts: Ubuntu 24.04 restricts unprivileged user namespaces, and only the
      # Google Chrome package brings an AppArmor profile that lets its sandbox start.
      CHROME_PATH: /usr/bin/google-chrome
      # Both commands select the CPU torch; without the flags uv run would sync back to the default CUDA group.
      DECISION_UV: --project services/decision --locked --no-default-groups --group cpu
    steps:
      - uses: actions/checkout@v7

      # setup-uv publishes no major tags since v8: pinned to the v10.3.0 commit.
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.19"
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"

      # serve.py pins the laya-browser revision, so a re-pin downloads the new weights.
      # Restore and save are split: actions/cache saves only after a green job, so red runs re-downloaded them.
      - id: hf-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/huggingface
          key: laya-browser-${{ hashFiles('services/decision/serve.py') }}

      - name: Start the decision server
        run: |
          uv sync $DECISION_UV
          mkdir -p reports
          nohup uv run $DECISION_UV python services/decision/serve.py > reports/decision.log 2>&1 &

      - name: Install test dependencies
        run: uv sync --locked

      - name: Wait for the decision server
        id: decision
        run: |
          for _ in $(seq 120); do
            curl -sf -o /dev/null http://127.0.0.1:8791/ && exit 0
            sleep 5
          done
          cat reports/decision.log
          exit 1

      # Saved once the server is up: its weights are complete then, whatever the tests do.
      - if: ${{ always() && steps.decision.outcome == 'success' && steps.hf-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/huggingface
          key: ${{ steps.hf-cache.outputs.cache-primary-key }}

      - name: Run tests
        run: uv run --locked pytest --headless

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: report
          path: reports/

  # The latest main report at the Pages URL; PRs keep theirs as the run artifact. A failed run is published too:
  # that report is the one worth reading.
  pages:
    needs: ui-tests
    if: ${{ !cancelled() && github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v8
        continue-on-error: true  # a run that failed during setup uploaded nothing
        with:
          name: report

      # report.html is self-contained (screenshots embedded), so it is the whole site.
      # A run that failed before pytest has none: the published report stays, with a warning instead of a red job.
      - id: site
        run: |
          if [ -f report.html ]; then
            mkdir site && mv report.html site/index.html && echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No report.html: the run failed before the tests, see the ui-tests job log"
          fi

      - if: ${{ steps.site.outputs.ready == 'true' }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - if: ${{ steps.site.outputs.ready == 'true' }}
        id: deploy
        uses: actions/deploy-pages@v5
